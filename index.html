<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mặt bằng 9.5 × 30</title>
<style>
  :root{
    --ink:#111; --dim:#8a1c1c; --paper:#fdfdfb; --panel:#fff; --muted:#666;
  }
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    margin:0;overflow:hidden;display:flex;flex-direction:column}
  header{flex:none;padding:10px 14px 0;background:#f2f0ea;border-bottom:1px solid #d8d5cd}
  h1{font-size:18px;margin:0 0 2px;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin:0 0 10px}

  .app{flex:1;min-height:0;display:flex;align-items:stretch}
  .side{width:440px;flex:none;min-width:0;overflow-y:auto;overscroll-behavior:contain;
    background:#f7f5f0;border-left:1px solid #c9c6bd;padding:0}
  .side[hidden]{display:none}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-bottom:10px}
  .bar button{font:inherit;font-size:13px;line-height:1;padding:7px 11px;border:1px solid #b9b4a8;
    background:#fbfaf7;border-radius:4px;cursor:pointer;color:#222}
  .bar button:hover{background:#fff;border-color:#8d8778}
  .bar button:active{background:#efece5}
  .bar select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #8d8778;
    border-radius:4px;background:#fff;color:#222;cursor:pointer;max-width:280px}
  .bar label{font-size:12px;color:#555}
  .bar .zoomval{font-variant-numeric:tabular-nums;min-width:62px;text-align:center;
    font-size:13px;color:#444;padding:0 4px}
  .bar .sep{width:1px;align-self:stretch;background:#c9c4b8;margin:0 5px}
  .bar .hint{color:var(--muted);font-size:12px;margin-left:auto}

  .sheet{flex:1;min-width:0;background:var(--paper);overflow:hidden}
  .viewer{height:100%;position:relative;background:var(--paper)}
  #plan{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #plan.drag{cursor:grabbing}

  /* toàn màn hình: chỉ còn bản vẽ tràn viền + một nút thoát góc phải trên */
  .sheet:fullscreen{background:var(--paper);position:relative}
  .sheet:fullscreen .viewer{height:100%}
  #zExit{display:none}
  .sheet:fullscreen #zExit{
    display:flex;align-items:center;justify-content:center;
    position:absolute;z-index:10;top:18px;right:18px;width:46px;height:46px;
    font:400 21px/1 ui-sans-serif,system-ui,sans-serif;color:#fff;cursor:pointer;
    border:0;border-radius:50%;
    background:rgba(28,28,30,.74);backdrop-filter:blur(4px);
    box-shadow:0 4px 18px rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:opacity .2s ease, background .15s ease}
  .sheet:fullscreen #zExit.show{opacity:1;pointer-events:auto}
  .sheet:fullscreen #zExit:hover{background:rgba(28,28,30,.92)}

  table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:10px}
  th,td{border:1px solid #d8d5cd;padding:5px 8px;text-align:left}
  th{background:#f0eee8;font-weight:600;position:sticky;top:0;z-index:1;
    box-shadow:0 1px 0 #d8d5cd, 0 3px 8px -4px rgba(0,0,0,.28)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.tot td{font-weight:700;background:#f6f4ee}
  .side>section{background:var(--panel);border:1px solid #d8d5cd;border-radius:3px;
    padding:12px 14px;margin:14px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:#444;margin:0 0 8px;
    border-bottom:1px solid #ddd;padding-bottom:5px}
  .note{font-size:12.5px;color:#7a2b12;background:#fdf3ec;border-left:3px solid #c8734a;
    padding:9px 11px;border-radius:2px;margin-top:12px}
  code{background:#eeece6;padding:1px 4px;border-radius:2px;font-size:12px}
  .new{color:#0a6b3d;font-weight:600}
  .vmeta{font-size:12.5px;color:#555;margin:0 0 8px}
  .vlist{margin:8px 0 0;padding-left:18px;font-size:12.5px}
  .vlist li{margin-bottom:4px}
  .chk{margin-top:12px;padding:8px 11px;border-radius:2px;font-size:12.5px;border-left:3px solid}
  .chk.ok{background:#eef7f1;border-color:#0a6b3d;color:#0a5c34}
  .chk.bad{background:#fdeeec;border-color:#c0392b;color:#8e2b20}
  .chk ul{margin:6px 0 0;padding-left:18px}
  .chk li{margin-bottom:3px}

  @media (max-width:900px){
    html,body{height:auto}
    body{overflow:auto}
    .app{flex-direction:column}
    .sheet{flex:none;height:68vh;min-height:320px;border-bottom:1px solid #c9c6bd}
    .side{width:auto;border-left:none;overflow:visible}
  }
</style>

<header>
  <div class="titles">
    <h1>MẶT BẰNG TẦNG TRỆT — LÔ 9.5 × 30 m</h1>
    <p class="sub" id="subline">285 m² &nbsp;·&nbsp; Tỉ lệ 1:100 &nbsp;·&nbsp; Kích thước tim tường</p>
  </div>

  <div class="bar">
    <label for="ver">Phiên bản</label>
    <select id="ver"></select>
    <span class="sep"></span>
    <button id="zOut" title="Thu nhỏ (phím −)">−</button>
    <span class="zoomval" id="zVal">100%</span>
    <button id="zIn" title="Phóng to (phím +)">+</button>
    <span class="sep"></span>
    <button id="zFit" title="Xem toàn bộ (phím 0)">Vừa khung</button>
    <button id="zWide">Vừa bề ngang</button>
    <button id="z100">100%</button>
    <span class="sep"></span>
    <button id="zDim" title="Đổi giữa kích thước tim tường và kích thước sử dụng">Nhãn: Tim tường</button>
    <span class="sep"></span>
    <button id="zRot" title="Xoay bản vẽ 90° (phím R)">⟳ Xoay 90°</button>
    <button id="zSide" title="Ẩn cột bảng để bản vẽ rộng hơn">Ẩn bảng</button>
    <button id="zFull" title="Toàn màn hình (phím F · thoát bằng Esc)">⛶ Toàn màn hình</button>
    <span class="hint">Lăn chuột để zoom · kéo để di chuyển · phím + − 0 R F</span>
  </div>
</header>

<div class="app">
  <div class="sheet">
    <div class="viewer"><svg id="plan"></svg></div>
    <button id="zExit" title="Thoát toàn màn hình (Esc)" aria-label="Thoát toàn màn hình">✕</button>
  </div>

  <aside class="side">
    <section>
      <h2 id="vTitle">Phiên bản</h2>
      <p class="vmeta" id="vMeta"></p>
      <div id="vNote"></div>
      <ul class="vlist" id="vChanges"></ul>
      <div id="vCheck"></div>
    </section>
    <section>
      <h2>Bảng thống kê phòng</h2>
      <table id="sched"></table>
    </section>
    <section>
      <h2>Bảng cửa</h2>
      <table id="tblDoors"></table>
    </section>
    <section id="secWin">
      <h2>Bảng cửa sổ</h2>
      <table id="tblWins"></table>
    </section>
    <section id="secSky">
      <h2>Bảng lấy sáng mái</h2>
      <table id="tblSky"></table>
    </section>
    <section>
      <h2>Ký hiệu chung</h2>
      <table id="legend"></table>
      <div class="note" id="warn"></div>
    </section>
  </aside>
</div>

<script>
/* ═══════════ SỔ ĐĂNG KÝ PHIÊN BẢN ═══════════
   Mỗi phiên bản là một snapshot đầy đủ của mặt bằng, nằm trong versions/v<n>.js
   và tự đăng ký qua definePlan(). Thứ tự trong VERSIONS = thứ tự thẻ <script> dưới đây.
   Thêm bản mới = thêm file versions/v<n+1>.js + một thẻ <script>. Không sửa bản cũ. */

const LOT = {w:9.5, d:30.0};
const VERSIONS = [];
function definePlan(v){ VERSIONS.push(v); }
</script>

<script src="versions/v1.js"></script>
<script src="versions/v2.js"></script>
<script src="versions/v3.js"></script>
<script src="versions/v4.js"></script>
<script src="versions/v5.js"></script>
<script src="versions/v6.js"></script>
<script src="versions/v7.js"></script>
<script src="versions/v8.js"></script>
<script src="versions/v9.js"></script>
<script src="versions/v10.js"></script>
<script src="versions/v11.js"></script>
<script src="versions/v12.js"></script>

<script>

/* ═══════════ TRẠNG THÁI ═══════════ */
let V, ROOMS, WALLS, DOORS, WINDOWS, SKYLIGHTS, FURN, GATES, STRIPS, DIMS;
let ROT = 0;
let LABELMODE = 'tim';        // 'tim' = tim tường (mặc định) · 'sd' = sử dụng, đã trừ tường

/* ═══════════ NỀN SVG ═══════════ */
const M = v => v*100;                          // 1 m = 100 đơn vị (=1cm @1:100)
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('plan');
const PAD = {l:265, r:265, t:225, b:415};
const BOX = {x:-PAD.l, y:-PAD.t, w:M(LOT.w)+PAD.l+PAD.r, h:M(LOT.d)+PAD.t+PAD.b};
const BCX = BOX.x + BOX.w/2, BCY = BOX.y + BOX.h/2;

const scene = document.createElementNS(NS,'g');
svg.appendChild(scene);

const el = (n,a={},p)=>{const e=document.createElementNS(NS,n);
  for(const k in a){ if(a[k]==null) continue; e.setAttribute(k.replace(/_/g,'-'),a[k]); }
  (p||scene).appendChild(e); return e;};
const g = (a={})=>el('g',a);

const defs = el('defs');
defs.innerHTML = `
<pattern id="pYard" width="14" height="14" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#f4f2ec"/><circle cx="7" cy="7" r="1.1" fill="#cfcabb"/></pattern>
<pattern id="pWet" width="20" height="20" patternUnits="userSpaceOnUse">
  <rect width="20" height="20" fill="#eef3f5"/>
  <path d="M0 0h20M0 0v20" stroke="#c3d3da" stroke-width="1.1"/></pattern>
<pattern id="pCirc" width="26" height="26" patternUnits="userSpaceOnUse">
  <rect width="26" height="26" fill="#f8f5ec"/>
  <path d="M0 26L26 0" stroke="#e2d9c2" stroke-width="1.2"/></pattern>`;

const FILL = {yard:'url(#pYard)', wet:'url(#pWet)', circ:'url(#pCirc)', room:'#ffffff'};
const DC = '#8a1c1c';

/* ═══════════ DIỆN TÍCH SỬ DỤNG (thông thủy) ═══════════
   Toạ độ phòng là tim tường. Trừ nửa bề dày mỗi bức tường bao quanh
   để ra kích thước lọt lòng — đây mới là phần dùng được. */
function clearOf(room, walls){
  walls = walls || WALLS;
  const [,,x,y,w,h] = room;
  // bề dày tường nằm trên cạnh đó; 0 nếu cạnh để trống (thông sang phòng khác)
  const wallOn = (ax,pos,a,b) => {
    let t = 0;
    for(const [wax,wpos,wa,wb,wt] of walls){
      if(wax !== ax || Math.abs(wpos - pos) > 0.001) continue;
      const overlap = Math.min(wb,b) - Math.max(wa,a);
      if(overlap > (b-a)*0.5 - 0.001) t = Math.max(t, wt);
    }
    return t;
  };
  const cw = w - wallOn('v',x,y,y+h)/2 - wallOn('v',x+w,y,y+h)/2;
  const ch = h - wallOn('h',y,x,x+w)/2 - wallOn('h',y+h,x,x+w)/2;
  return {w:cw, h:ch, a:cw*ch};
}
const sumClear = rooms => +rooms.reduce((s,r)=>s+clearOf(r).a,0).toFixed(2);

/* ═══════════ 13 PHÉP KIỂM ═══════════
   Chạy được trên bất kỳ phiên bản nào, trả về danh sách lỗi (rỗng = sạch). */
const CHECKS = [
  'Cột trái cộng đủ 150.00 m²',
  'Cột phải cộng đủ 135.00 m²',
  'Chuỗi kích thước dọc cộng đủ 30.0 m',
  'Diện tích kín khai báo khớp tính toán',
  'Chuỗi kích thước khớp ranh giới phòng thật',
  'Mọi mã cửa có mô tả',
  'Mọi mã cửa sổ có mô tả',
  'Mã cửa sổ liên tục W1…Wn',
  'Cửa có cánh nằm gọn trên một đoạn tường',
  'Mọi phòng kín có ít nhất một cửa',
  'Hai lỗ mở trên cùng tường không chồng nhau',
  'Nội thất nằm trong phòng và không chồng nhau',
  'Nội thất không nằm trong vùng quét cánh cửa',
];

function validate(v){
  const e=[], A=r=>r[4]*r[5], n=x=>+x.toFixed(2);
  const ovl=(p,q,s,t)=>Math.min(q,t)-Math.max(p,s);

  const L=v.rooms.filter(r=>r[0][0]==='L').reduce((s,r)=>s+A(r),0);
  if(Math.abs(L-150)>.01) e.push(`Cột trái cộng ra ${n(L)} m², phải là 150.00`);
  const R=v.rooms.filter(r=>r[0][0]==='R'&&r[0]!=='R5').reduce((s,r)=>s+A(r),0);
  if(Math.abs(R-135)>.01) e.push(`Cột phải cộng ra ${n(R)} m², phải là 135.00`);

  const ch=v.dims.left, span=ch[ch.length-1]-ch[0];
  if(Math.abs(span-30)>.01) e.push(`Chuỗi dọc cộng ra ${span} m, phải là 30.0`);

  const kin=v.rooms.filter(r=>r[6]!=='yard'&&r[0]!=='R3').reduce((s,r)=>s+A(r),0);
  if(Math.abs(kin-v.areas.kin)>.01) e.push(`DT kín khai báo ${v.areas.kin} ≠ tính ra ${n(kin)}`);

  const ys=[...new Set(v.rooms.filter(r=>r[0][0]==='L'&&r[4]>=2.4)
             .flatMap(r=>[r[3],r[3]+r[5]]))].sort((a,b)=>a-b);
  if(ys.join(',')!==ch.join(',')) e.push(`Chuỗi kích thước lệch ranh phòng: [${ys}] ≠ [${ch}]`);

  v.doors.forEach(d=>{ if(!d[9]) e.push(`${d[0]} chưa có mô tả`); });
  v.windows.forEach(w=>{ if(!w[6]) e.push(`${w[0]} chưa có mô tả`); });

  const ids=v.windows.map(w=>w[0]);
  if(ids.join(',')!==ids.map((_,i)=>'W'+(i+1)).join(','))
    e.push(`Mã cửa sổ nhảy số: ${ids.join(', ')}`);

  for(const o of [...v.doors.filter(d=>d[5]!=='open'), ...v.windows]){
    const [id,ax,pos,a,b]=o;
    const onWall=v.walls.some(([wax,wpos,wa,wb])=>
      wax===ax&&Math.abs(wpos-pos)<.001&&wa<=a+.001&&wb>=b-.001);
    const onGate=v.gates.some(([gax,gpos])=>gax===ax&&Math.abs(gpos-pos)<.001);
    if(!onWall&&!onGate) e.push(`${id} không nằm trên đoạn tường nào`);
  }

  for(const r of v.rooms){
    if(r[6]==='yard'||r[0]==='R3') continue;      // sân và lối đi hở không cần cửa
    const [id,nm,x,y,w,h]=r;
    const ok=v.doors.some(([,ax,pos,a,b])=>
      ax==='v' ? (Math.abs(pos-x)<.01||Math.abs(pos-(x+w))<.01) && ovl(a,b,y,y+h)>0.01
               : (Math.abs(pos-y)<.01||Math.abs(pos-(y+h))<.01) && ovl(a,b,x,x+w)>0.01);
    if(!ok) e.push(`${id} ${nm} không có cửa nào`);
  }

  const seg=[...v.doors,...v.windows];
  for(let i=0;i<seg.length;i++) for(let j=i+1;j<seg.length;j++){
    const a=seg[i], b=seg[j];
    if(a[1]!==b[1]||Math.abs(a[2]-b[2])>.001) continue;
    if(ovl(a[3],a[4],b[3],b[4])>0.001) e.push(`${a[0]} và ${b[0]} chồng lỗ mở`);
  }

  for(const [k,x,y,w,h] of v.furn){
    const inside=v.rooms.some(([,,rx,ry,rw,rh])=>
      x>=rx-.01&&y>=ry-.01&&x+w<=rx+rw+.01&&y+h<=ry+rh+.01);
    if(!inside) e.push(`Nội thất ${k} @${x},${y} lọt ra ngoài phòng`);
  }
  for(let i=0;i<v.furn.length;i++) for(let j=i+1;j<v.furn.length;j++){
    const [ka,ax,ay,aw,ah]=v.furn[i], [kb,bx,by,bw,bh]=v.furn[j];
    if(ovl(ax,ax+aw,bx,bx+bw)>0.02 && ovl(ay,ay+ah,by,by+bh)>0.02)
      e.push(`Nội thất ${ka} chồng ${kb}`);
  }

  for(const [id,ax,pos,a,b,kind,,open] of v.doors){
    if(kind!=='swing') continue;
    const Ln=b-a;
    const s = ax==='v'
      ? {x0:Math.min(pos,pos+open*Ln), x1:Math.max(pos,pos+open*Ln), y0:a, y1:b}
      : {x0:a, x1:b, y0:Math.min(pos,pos+open*Ln), y1:Math.max(pos,pos+open*Ln)};
    for(const [k,x,y,w,h] of v.furn)
      if(ovl(x,x+w,s.x0,s.x1)>0.08 && ovl(y,y+h,s.y0,s.y1)>0.08)
        e.push(`${id} quét vào nội thất ${k} @${x},${y}`);
  }
  return e;
}

// các lớp vẽ — tạo lại mỗi lần đổi phiên bản
let gRoom,gWall,gHole,gSky,gF,gW,gD,gDim,gL,gT,TB;

/* ═══════════ CÁC LỚP VẼ ═══════════ */

function drawRooms(){
  for(const [id,name,x,y,w,h,type] of ROOMS)
    el('rect',{x:M(x),y:M(y),width:M(w),height:M(h),
      fill:FILL[type],stroke:'#d5d1c6',stroke_width:1},gRoom);
}

function drawWalls(){
  for(const [ax,pos,a,b,t] of WALLS){
    const o = M(t)/2;
    const r = ax==='h' ? {x:M(a)-o, y:M(pos)-o, width:M(b-a)+2*o, height:M(t)}
                       : {x:M(pos)-o, y:M(a)-o, width:M(t), height:M(b-a)+2*o};
    el('rect',{...r, fill:'#141414'},gWall);
  }
  // khoét lỗ cửa, cửa sổ, cổng
  const hole = (ax,pos,a,b,t=0.24)=>{
    const o=M(t)/2;
    const r = ax==='h' ? {x:M(a), y:M(pos)-o, width:M(b-a), height:M(t)}
                       : {x:M(pos)-o, y:M(a), width:M(t), height:M(b-a)};
    el('rect',{...r, fill:'#fdfdfb'},gHole);
  };
  for(const d of DOORS)   hole(d[1],d[2],d[3],d[4]);
  for(const w of WINDOWS) hole(w[1],w[2],w[3],w[4]);
  for(const [ax,pos,a,b] of GATES) hole(ax,pos,a,b);
  for(const [ax,pos,a,b,nm] of GATES){
    el('line',{x1:M(a),y1:M(pos),x2:M(b),y2:M(pos),
      stroke:'#999',stroke_width:2.5,stroke_dasharray:'12 8'},gHole);
    const t=el('text',{x:M((a+b)/2),y:M(pos)-16,font_size:19,text_anchor:'middle',
      fill:'#444',font_family:'ui-sans-serif,system-ui,sans-serif',font_weight:600},gHole);
    t.textContent=nm;
  }
  // ranh lô chính / lô phụ ở phần sân
  for(const [a,b] of STRIPS)
    el('line',{x1:M(5),y1:M(a),x2:M(5),y2:M(b),stroke:'#a9a394',stroke_width:2,
      stroke_dasharray:'18 8 4 8'},gHole);
}

function drawSkylights(){
  for(const [id,name,x,y,w,h] of SKYLIGHTS){
    el('rect',{x:M(x),y:M(y),width:M(w),height:M(h),rx:4,
      fill:'#dceaf2',fill_opacity:.5,stroke:'#3f88ad',stroke_width:2,
      stroke_dasharray:'13 9'},gSky);
    el('path',{d:`M${M(x)} ${M(y+h)}L${M(x+w)} ${M(y)}`,stroke:'#8fb9cd',
      stroke_width:1.4,fill:'none'},gSky);
  }
}

function drawFurniture(){
  const fr=(x,y,w,h,o={})=>el('rect',{x:M(x),y:M(y),width:M(w),height:M(h),rx:3,...o},gF);
  for(const [k,x,y,w,h] of FURN){
    if(k==='sofa'||k==='cab'||k==='tbl'||k==='altar'||k==='wash'){
      fr(x,y,w,h, k==='altar'?{fill:'#f0e6d2'}:{});
      if(k==='cab') for(let i=1;i<3;i++)
        el('line',{x1:M(x),y1:M(y+h*i/3),x2:M(x+w),y2:M(y+h*i/3),stroke:'#b9b9b9'},gF);
    } else if(k==='bed'){                        // đầu giường ở cạnh trên
      fr(x,y,w,h);
      el('rect',{x:M(x+.05),y:M(y+.05),width:M(w-.1),height:M(h*0.28),rx:4,fill:'#eceff2'},gF);
      el('line',{x1:M(x),y1:M(y+h*0.33),x2:M(x+w),y2:M(y+h*0.33)},gF);
    } else if(k==='bedw'){                       // đầu giường ở cạnh trái
      fr(x,y,w,h);
      el('rect',{x:M(x+.05),y:M(y+.05),width:M(w*0.28),height:M(h-.1),rx:4,fill:'#eceff2'},gF);
      el('line',{x1:M(x+w*0.33),y1:M(y),x2:M(x+w*0.33),y2:M(y+h)},gF);
    } else if(k==='wc'){
      el('rect',{x:M(x),y:M(y),width:M(w),height:M(h*0.34),rx:3},gF);
      el('ellipse',{cx:M(x+w/2),cy:M(y+h*0.68),rx:M(w/2),ry:M(h*0.33)},gF);
    } else if(k==='lav'){
      fr(x,y,w,h); el('circle',{cx:M(x+w/2),cy:M(y+h/2),r:M(Math.min(w,h)*0.32)},gF);
    } else if(k==='shower'){
      fr(x,y,w,h,{fill:'#e4edf1'});
      el('circle',{cx:M(x+w*0.75),cy:M(y+h*0.25),r:8},gF);
      el('path',{d:`M${M(x)} ${M(y+h)}L${M(x+w)} ${M(y)}`,stroke:'#a9c3cf',fill:'none'},gF);
    } else if(k==='kit'||k==='kitsink'||k==='kithob'){  // kệ bếp: tự xoay theo chiều dài
      fr(x,y,w,h,{fill:'#f2f2ef'});
      const horiz = w >= h, Ln = horiz ? w : h;
      const at = t => horiz ? [x+t, y+h/2] : [x+w/2, y+t];
      if(k!=='kitsink') for(const t of [Ln*0.20, Ln*0.36]){   // bếp nấu
        const [cx,cy] = at(t);
        el('circle',{cx:M(cx),cy:M(cy),r:M(0.20)},gF);
      }
      if(k!=='kithob'){                                       // chậu rửa
        const sc = Ln*0.72, sl = Math.min(1.0, Ln*0.28);
        if(horiz) el('rect',{x:M(x+sc-sl/2),y:M(y+.08),width:M(sl),height:M(h-.16),rx:4},gF);
        else      el('rect',{x:M(x+.08),y:M(y+sc-sl/2),width:M(w-.16),height:M(sl),rx:4},gF);
      }
    } else if(k==='desk'){                       // bàn làm việc: mặt bàn áp tường phải + ghế
      const dw = 0.60;
      fr(x+w-dw, y, dw, h, {fill:'#f6f4ee'});
      el('line',{x1:M(x+w-dw+0.15),y1:M(y),x2:M(x+w-dw+0.15),y2:M(y+h),stroke:'#cfcfcf'},gF);
      el('rect',{x:M(x+w-dw-0.62),y:M(y+h/2-0.24),width:M(0.48),height:M(0.48),rx:7},gF);
    } else if(k==='dine'){
      fr(x,y,w,h);
      for(let i=0;i<3;i++){ fr(x-0.42,y+0.25+i*0.7,0.36,0.45); fr(x+w+0.06,y+0.25+i*0.7,0.36,0.45); }
    } else if(k==='round'){
      el('circle',{cx:M(x+w/2),cy:M(y+h/2),r:M(w/2)},gF);
      for(let i=0;i<4;i++){const a=i*Math.PI/2+0.78;
        el('circle',{cx:M(x+w/2+Math.cos(a)*1.05),cy:M(y+h/2+Math.sin(a)*1.05),r:M(0.24)},gF);}
    } else if(k==='car'){
      el('rect',{x:M(x),y:M(y),width:M(w),height:M(h),rx:M(0.55),fill:'#eef0f2',stroke:'#8d949b'},gF);
      el('rect',{x:M(x+.16),y:M(y+.75),width:M(w-.32),height:M(1.35),rx:M(0.22),fill:'#cfd6dc',stroke:'#8d949b'},gF);
      el('rect',{x:M(x+.16),y:M(y+2.6),width:M(w-.32),height:M(1.2),rx:M(0.2),fill:'#cfd6dc',stroke:'#8d949b'},gF);
    }
  }
}

function drawWindows(){
  for(const [id,ax,pos,a,b,flag] of WINDOWS){
    const c = flag==='warn' ? '#c0392b' : (flag==='new' ? '#0a6b3d' : '#1a1a1a');
    const t=0.24, o=M(t)/2;
    if(ax==='h'){
      el('rect',{x:M(a),y:M(pos)-o,width:M(b-a),height:M(t),fill:'#fff',stroke:c,stroke_width:2},gW);
      el('line',{x1:M(a),y1:M(pos),x2:M(b),y2:M(pos),stroke:c,stroke_width:2},gW);
    } else {
      el('rect',{x:M(pos)-o,y:M(a),width:M(t),height:M(b-a),fill:'#fff',stroke:c,stroke_width:2},gW);
      el('line',{x1:M(pos),y1:M(a),x2:M(pos),y2:M(b),stroke:c,stroke_width:2},gW);
    }
  }
}

function drawDoors(){
  for(const [id,ax,pos,a,b,kind,hinge,open,flag] of DOORS){
    const col = flag==='new' ? '#0a6b3d' : '#1a1a1a';
    const L = b-a;
    if(kind==='open'){                                 // ô mở thông
      const d = ax==='h' ? [[a,pos],[b,pos]] : [[pos,a],[pos,b]];
      el('line',{x1:M(d[0][0]),y1:M(d[0][1]),x2:M(d[1][0]),y2:M(d[1][1]),
        stroke:'#999',stroke_width:2,stroke_dasharray:'10 7'},gD);
      continue;
    }
    if(kind==='quad'){                                 // cửa 4 cánh
      const q = L/4;
      if(ax==='h'){
        el('rect',{x:M(a),y:M(pos)-3,width:M(L),height:6,fill:col},gD);
        for(let i=1;i<4;i++) el('line',{x1:M(a+q*i),y1:M(pos)-9,x2:M(a+q*i),y2:M(pos)+9,
          stroke:col,stroke_width:2},gD);
      } else {
        el('rect',{x:M(pos)-3,y:M(a),width:6,height:M(L),fill:col},gD);
        for(let i=1;i<4;i++) el('line',{x1:M(pos)-9,y1:M(a+q*i),x2:M(pos)+9,y2:M(a+q*i),
          stroke:col,stroke_width:2},gD);
      }
      for(const [hv,dir] of [[a,1],[b,-1]]){
        const hx = ax==='h' ? hv : pos, hy = ax==='h' ? pos : hv;
        const px = ax==='h' ? hx : hx + open*q, py = ax==='h' ? hy + open*q : hy;
        const ox = ax==='h' ? hx + dir*q : pos,  oy = ax==='h' ? pos : hy + dir*q;
        const cr = (px-hx)*(oy-hy) - (py-hy)*(ox-hx);
        el('path',{d:`M${M(px)} ${M(py)}A${M(q)} ${M(q)} 0 0 ${cr>0?1:0} ${M(ox)} ${M(oy)}`,
          fill:'none',stroke:'#9a9a9a',stroke_width:1.6},gD);
        el('line',{x1:M(hx),y1:M(hy),x2:M(px),y2:M(py),stroke:col,stroke_width:5},gD);
      }
      continue;
    }
    if(kind==='slide1'){                               // cửa lùa 1 cánh
      const s = 0.055;
      if(ax==='h'){
        el('rect',{x:M(a),y:M(pos-s*1.6),width:M(L),height:M(s*1.5),fill:col},gD);
        el('line',{x1:M(a),y1:M(pos),x2:M(b),y2:M(pos),stroke:'#aaa',
          stroke_width:1.4,stroke_dasharray:'6 5'},gD);
      } else {
        el('rect',{x:M(pos-s*1.6),y:M(a),width:M(s*1.5),height:M(L),fill:col},gD);
        el('line',{x1:M(pos),y1:M(a),x2:M(pos),y2:M(b),stroke:'#aaa',
          stroke_width:1.4,stroke_dasharray:'6 5'},gD);
      }
      continue;
    }
    if(kind==='slide'){                                // cửa lùa
      const s = 0.055;
      if(ax==='h'){
        el('rect',{x:M(a),y:M(pos-s*1.6),width:M(L*0.52),height:M(s*1.5),fill:col},gD);
        el('rect',{x:M(a+L*0.48),y:M(pos+s*0.1),width:M(L*0.52),height:M(s*1.5),fill:col},gD);
      } else {
        el('rect',{x:M(pos-s*1.6),y:M(a),width:M(s*1.5),height:M(L*0.52),fill:col},gD);
        el('rect',{x:M(pos+s*0.1),y:M(a+L*0.48),width:M(s*1.5),height:M(L*0.52),fill:col},gD);
      }
      continue;
    }
    // cửa mở quay
    const hx = ax==='h' ? (hinge==='a'?a:b) : pos;
    const hy = ax==='h' ? pos               : (hinge==='a'?a:b);
    const ox = ax==='h' ? (hinge==='a'?b:a) : pos;
    const oy = ax==='h' ? pos               : (hinge==='a'?b:a);
    const px = ax==='h' ? hx : hx + open*L;
    const py = ax==='h' ? hy + open*L : hy;
    const v1=[px-hx,py-hy], v2=[ox-hx,oy-hy];
    const sweep = (v1[0]*v2[1]-v1[1]*v2[0]) > 0 ? 1 : 0;
    el('path',{d:`M${M(px)} ${M(py)}A${M(L)} ${M(L)} 0 0 ${sweep} ${M(ox)} ${M(oy)}`,
      fill:'none',stroke:'#9a9a9a',stroke_width:1.6},gD);
    el('line',{x1:M(hx),y1:M(hy),x2:M(px),y2:M(py),stroke:col,stroke_width:5.5},gD);
  }
}

/* ── đường kích thước ── */
const F = n => n.toFixed(n%1?1:0)+' m';

function drawDims(){
  const txt=(x,y,s,o={})=>{const t=el('text',{x,y,fill:DC,font_size:o.fs||30,
    text_anchor:'middle',font_weight:600,transform:o.tr||null,dy:o.dy||null},gDim);
    t.textContent=s; return t;};
  const tick=(x,y,ang)=>el('line',{x1:x-9,y1:y-9,x2:x+9,y2:y+9,stroke:DC,stroke_width:2.2,
    transform:`rotate(${ang} ${x} ${y})`},gDim);

  function dimH(a,b,y,label,ext){
    el('line',{x1:M(a),y1:y,x2:M(b),y2:y,stroke:DC,stroke_width:1.6},gDim);
    [a,b].forEach(v=>{
      tick(M(v),y,0);
      el('line',{x1:M(v),y1:ext,x2:M(v),y2:y+(ext<y?14:-14),stroke:DC,stroke_width:.9,
        stroke_dasharray:'6 5'},gDim);
    });
    txt((M(a)+M(b))/2, y-13, label);
  }
  function dimV(a,b,x,label,ext){
    el('line',{x1:x,y1:M(a),x2:x,y2:M(b),stroke:DC,stroke_width:1.6},gDim);
    [a,b].forEach(v=>{
      tick(x,M(v),90);
      el('line',{x1:ext,y1:M(v),x2:x+(ext<x?14:-14),y2:M(v),stroke:DC,stroke_width:.9,
        stroke_dasharray:'6 5'},gDim);
    });
    const cy=(M(a)+M(b))/2;
    txt(0,0,label,{tr:`translate(${x-13},${cy}) rotate(${ROT?90:-90})`, dy: ROT?24:null});
  }

  // ngang — trên
  dimH(0,5.0,-95,F(5.0),0); dimH(5.0,9.5,-95,F(4.5),0);
  dimH(0,9.5,-175,'9.5 m',0);
  // dọc — trái (chuỗi theo phiên bản)
  const cl = DIMS.left;
  for(let i=0;i<cl.length-1;i++) dimV(cl[i],cl[i+1],-105,F(cl[i+1]-cl[i]),0);
  dimV(0,30,-215,'30.0 m',0);
  // dọc — phải
  [[0,18],[18,25],[25,30]].forEach(([a,b])=>dimV(a,b,M(9.5)+105,F(b-a),M(9.5)));
  dimV(0,30,M(9.5)+215,'30.0 m',M(9.5));
  // ngang — dưới (chuỗi theo phiên bản)
  const cb = DIMS.bottom;
  for(let i=0;i<cb.length-1;i++) dimH(cb[i],cb[i+1],M(30)+95,F(cb[i+1]-cb[i]),M(30));
  // ngang — trong: bề rộng phòng / hành lang
  const ix = DIMS.innerX, iy = M(DIMS.innerY)-95;
  for(let i=0;i<ix.length-1;i++) dimH(ix[i],ix[i+1],iy,F(ix[i+1]-ix[i]),M(DIMS.innerY));
}

/* ── nhãn phòng ── */
function drawLabels(){
  const SMALL = new Set(ROOMS.filter(r=>r[4]*r[5] < 8).map(r=>r[0]));
  for(const [id,name,x,y,w,h,type] of ROOMS){
    const cx=M(x+w/2), cy=M(y+h/2), sm=SMALL.has(id);
    const sw = ROT ? M(h) : M(w), sh = ROT ? M(w) : M(h);
    const rot = sw < 200 && sh > sw;
    // chừa 26 đơn vị mỗi chiều để chữ không chạm bề dày tường (tường bao 22 → nhô 11 vào trong)
    const avail = (rot ? sh : sw) - 26;
    const fs = sm?21:30, lh=sm?24:34;
    const ang = (ROT ? 90 : 0) + (rot ? -90 : 0);
    const gg = g({transform: ang ? `rotate(${ang} ${cx} ${cy})` : null});
    gL.appendChild(gg);

    let lines=[name];
    if(avail < name.length*fs*0.58){
      lines=[]; let cur='';
      for(const wd of name.split(' ')){
        if((cur+' '+wd).trim().length*fs*0.58 > avail && cur){lines.push(cur);cur=wd;}
        else cur=(cur+' '+wd).trim();
      }
      lines.push(cur);
    }
    const total = lines.length+2;
    const texts = [];
    lines.forEach((ln,i)=>{
      const t=el('text',{x:cx, y:cy - total*lh/2 + lh*(i+0.78), font_size:fs, font_weight:700,
        fill:'#111', letter_spacing:'0.02em'},gg); t.textContent=ln; texts.push(t);
    });
    // R4 bị WC khách chiếm một góc → trừ ra
    const r5 = ROOMS.find(r=>r[0]==='R5');
    let sub;
    if(LABELMODE === 'sd'){
      const c = clearOf(ROOMS.find(r=>r[0]===id));
      const a = id==='R4' ? c.a - clearOf(r5).a : c.a;
      sub = [`${c.w.toFixed(2)} × ${c.h.toFixed(2)} m`, `${a.toFixed(2)} m² sd`];
    } else {
      const a = id==='R4' ? w*h - r5[4]*r5[5] : w*h;
      sub = [`${w.toFixed(1)} × ${h.toFixed(1)} m`, `${a.toFixed(2)} m²`];
    }
    sub.forEach((s,i)=>{
      const d=el('text',{x:cx, y:cy - total*lh/2 + lh*(lines.length+i+0.78),
        font_size:fs*(i?0.8:0.85), fill:i?'#6a6a6a':'#444', font_weight:i?600:400},gg);
      d.textContent = s; texts.push(d);
    });

    // nền ôm sát chữ, đo bằng bbox thật — không lấy nguyên bề rộng phòng nữa
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const t of texts){
      const b = t.getBBox();
      x0=Math.min(x0,b.x); y0=Math.min(y0,b.y);
      x1=Math.max(x1,b.x+b.width); y1=Math.max(y1,b.y+b.height);
    }
    if(isFinite(x0)){
      const px=8, py=5;
      const bg = el('rect',{x:x0-px, y:y0-py, width:(x1-x0)+px*2, height:(y1-y0)+py*2,
        fill:'#fdfdfb', opacity:.86, rx:3},gg);
      gg.insertBefore(bg, gg.firstChild);
    }
  }
}

/* ── mã cửa / cửa sổ / lấy sáng ── */
function drawTags(){
  const placed=[];
  for(const [,,x,y,w,h] of ROOMS) placed.push([x+w/2, y+h/2]);   // giữ chỗ cho nhãn phòng
  const clear=(x,y)=>!placed.some(([px,py])=>Math.abs(px-x)<0.52 && Math.abs(py-y)<0.46);

  const tag=(x,y,s,c)=>{
    const gg = ROT ? g({transform:`rotate(90 ${M(x)} ${M(y)})`}) : gT;
    if(ROT) gT.appendChild(gg);
    el('rect',{x:M(x)-21,y:M(y)-13,width:42,height:24,rx:4,
      fill:'#fff',stroke:c,stroke_width:1.4},gg);
    const t=el('text',{x:M(x),y:M(y)+5,fill:c,font_weight:700},gg); t.textContent=s;
    placed.push([x,y]);
  };
  const place=(ax,pos,a,b,id,c,side)=>{
    const mid=(a+b)/2, half=(b-a)/2;
    for(const off of [0.42,0.78,1.14,1.50])
      for(const sl of [0,0.45,-0.45,0.9,-0.9]){
        if(Math.abs(sl) > half + 0.5) continue;
        const x = ax==='h' ? mid + sl : pos + side*off;
        const y = ax==='h' ? pos + side*off : mid + sl;
        if(clear(x,y)){ tag(x,y,id,c); return; }
      }
    ax==='h' ? tag(mid,pos+side*0.42,id,c) : tag(pos+side*0.42,mid,id,c);
  };

  for(const [id,ax,pos,a,b,,,,flag] of DOORS)
    place(ax,pos,a,b,id, flag==='new' ? '#0a6b3d' : '#444', -1);
  for(const [id,ax,pos,a,b,flag] of WINDOWS){
    const c = flag==='warn' ? '#c0392b' : (flag==='new' ? '#0a6b3d' : '#444');
    place(ax,pos,a,b,id,c, (ax==='v' && pos===0) ? 1 : (ax==='h' ? 1 : -1));
  }
  for(const [id,,x,y,w,h] of SKYLIGHTS){
    const cx = x + w/2, cy = y + h/2;
    const cands = [[cx,y+0.8],[cx,y+h-0.8],[cx,y-0.4],[cx,y+h+0.4],
                   [x-0.45,cy],[x+w+0.45,cy],[cx,cy]];
    const p = cands.find(([px,py]) => clear(px,py)) || [cx,cy];
    tag(p[0], p[1], id, '#2f7897');
  }
}

  tt(M(5)+18, sy+14, 'mét', 20, 400, '#333');

  const ax0=M(9.5)-40, ay0=-160;
  el('path',{d:`M${ax0} ${ay0+70}L${ax0} ${ay0}M${ax0} ${ay0}l-13 22M${ax0} ${ay0}l13 22`,
    stroke:'#141414',stroke_width:2.6,fill:'none'},TB);
  const mt=el('text',{x:ax0,y:ay0+96,font_size:19,text_anchor:'middle',
    fill:'#141414',font_weight:600},TB);
  mt.textContent='MẶT TIỀN';
}

/* ── lớp ghi chú: vẽ lại khi xoay ── */
function drawAnnot(){
  gDim.textContent=''; gL.textContent=''; gT.textContent='';
  drawDims(); drawLabels(); drawTags();
}

/* ── dựng toàn bộ bản vẽ cho phiên bản đang chọn ── */
function buildPlan(){
  [...scene.children].forEach(c => { if(c !== defs) c.remove(); });
  gRoom = g(); gWall = g(); gHole = g(); gSky = g();
  gF    = g({stroke:'#5c5c5c', stroke_width:1.6, fill:'#fff'});
  gW    = g(); gD = g();
  gDim  = g({font_family:'ui-sans-serif,system-ui,sans-serif'});
  gL    = g({font_family:'ui-sans-serif,system-ui,sans-serif',text_anchor:'middle'});
  gT    = g({font_family:'ui-monospace,SFMono-Regular,Menlo,monospace',
             font_size:17,text_anchor:'middle'});
  TB    = g({font_family:'ui-sans-serif,system-ui,sans-serif'});

  drawRooms(); drawWalls(); drawSkylights(); drawFurniture();
  drawWindows(); drawDoors(); drawAnnot(); drawTitleBlock();
  scene.setAttribute('transform', ROT ? `rotate(${ROT} ${BCX} ${BCY})` : '');
}

    + ` &nbsp;<span style="color:#888">(sử dụng ${sdChinh.toFixed(2)} / ${sdKin.toFixed(2)})</span>`;
}

/* ═══════════ SINH ĐẶC TẢ MARKDOWN ═══════════ */
function specMarkdown(v){
  const n=(x,d=2)=>x.toFixed(d), C=r=>clearOf(r, v.walls);
  const KIND={swing:'Mở quay',slide:'Lùa 2 cánh',slide1:'Lùa 1 cánh',open:'Mở thông',quad:'4 cánh'};
  const TY={room:'Phòng',wet:'Vệ sinh',circ:'Lưu thông',yard:'Sân'};
  const AX=a=>a==='h'?'ngang':'dọc';
  const md=t=>String(t).replace(/<br><br>/g,'\n\n').replace(/<br>/g,'\n')
              .replace(/<\/?b>/g,'**').replace(/<code>/g,'`').replace(/<\/code>/g,'`');
  const kinR=v.rooms.filter(r=>r[6]!=='yard'&&r[0]!=='R3');
  const timKin=kinR.reduce((a,r)=>a+r[4]*r[5],0);
  const sdKin =kinR.reduce((a,r)=>a+C(r).a,0);
  const Lr=kinR.filter(r=>r[0][0]==='L');
  const timCh=Lr.reduce((a,r)=>a+r[4]*r[5],0), sdCh=Lr.reduce((a,r)=>a+C(r).a,0);
  const front=v.rooms.find(r=>r[0]==='L2')[3];
  const sumL=v.rooms.filter(r=>r[0][0]==='L').reduce((a,r)=>a+r[4]*r[5],0);
  const sumR=v.rooms.filter(r=>r[0][0]==='R'&&r[0]!=='R5').reduce((a,r)=>a+r[4]*r[5],0);
  const errs=validate(v);
  let s='';

  s+=`# Đặc tả mặt bằng — ${v.label}\n\n`;
  s+=`> Sinh tự động từ \`versions/${v.id}.js\` lúc ${new Date().toLocaleString('vi-VN')}. Không chép tay.\n`;
  s+=`> **Quy ước:** toạ độ và kích thước là **tim tường**. Gốc (0,0) = góc trên-trái lô. X→phải (0–9.5). Y→xuống (0–30).\n`;
  s+=`> Cột **Sử dụng** là kích thước lọt lòng, đã trừ nửa bề dày mỗi tường bao quanh.\n`;
  s+=`> Tường bao **220 mm** · Tường ngăn **100 mm**.\n\n${v.note}\n\n---\n\n`;

  s+=`## 1. Tổng quan\n\n| Mục | Tim tường | Sử dụng |\n|---|---:|---:|\n`;
  s+=`| Lô đất 9.5 × 30 | 285.00 m² | — |\n`;
  s+=`| **Khối nhà chính** | **${n(timCh)} m²** | ${n(sdCh)} m² |\n`;
  s+=`| **Toàn bộ phần kín** | **${n(timKin)} m²** | ${n(sdKin)} m² |\n`;
  s+=`| Hành lang ngoài (có mái, hở) | ${n(v.areas.hl)} m² | — |\n`;
  s+=`| Sân trống | ${n(v.areas.san)} m² | — |\n`;
  s+=`| Tường chiếm chỗ | ${n(timKin-sdKin)} m² | — |\n\n`;
  s+=`Nhà chính chạy từ \`y = ${n(front,1)}\` tới \`y = 30.0\` → **dài ${n(30-front,1)} m**.\n\n`;

  s+=`## 2. Bảng phòng\n\n| # | Phòng | x₁ | y₁ | x₂ | y₂ | Tim tường | DT tim | Sử dụng | DT sd | Loại |\n`;
  s+=`|---|---|---:|---:|---:|---:|---|---:|---|---:|---|\n`;
  for(const r of v.rooms){ const c=C(r);
    s+=`| ${r[0]} | ${r[1]} | ${n(r[2],1)} | ${n(r[3],1)} | ${n(r[2]+r[4],1)} | ${n(r[3]+r[5],1)}`
     +` | ${n(r[4],1)} × ${n(r[5],1)} | ${n(r[4]*r[5])} | ${n(c.w)} × ${n(c.h)} | ${n(c.a)} | ${TY[r[6]]} |\n`; }
  s+=`\n**Kiểm tra:** cột trái ${n(sumL)} + cột phải ${n(sumR)} = **${n(sumL+sumR)} m²**`
   +` (WC khách nằm trong sân phơi, không cộng riêng)\n`;
  s+=`**Chuỗi dọc lô chính:** `
   +v.dims.left.map((y,i,a)=>i?n(a[i]-a[i-1],1):null).filter(Boolean).join(' + ')+` = **30.0**\n\n`;

  s+=`## 3. Bảng cửa\n\n| Mã | Trục | Vị trí | Từ | Đến | Rộng | Loại | Chiều mở | Nối |\n`;
  s+=`|---|---|---:|---:|---:|---:|---|---|---|\n`;
  for(const [id,ax,pos,a,b,kind,hinge,open,,desc] of v.doors){
    const dir = kind==='swing'
      ? `bản lề ${hinge==='a'?'đầu nhỏ':'đầu lớn'}, mở ${open>0?'+':'−'}` : '—';
    s+=`| ${id} | ${AX(ax)} | ${n(pos,1)} | ${n(a)} | ${n(b)} | ${n(b-a)} | ${KIND[kind]} | ${dir} | ${md(desc)} |\n`;
  }

  s+=`\n## 4. Bảng cửa sổ\n\n| Mã | Trục | Vị trí | Từ | Đến | Rộng | Vị trí |\n|---|---|---:|---:|---:|---:|---|\n`;
  for(const [id,ax,pos,a,b,,desc] of v.windows)
    s+=`| ${id} | ${AX(ax)} | ${n(pos,1)} | ${n(a)} | ${n(b)} | ${n(b-a)} | ${md(desc)} |\n`;
  if(!v.windows.length) s+=`| — | | | | | | Bản này không có cửa sổ nào |\n`;

  if(v.skylights.length){
    s+=`\n## 5. Lấy sáng trên mái\n\n| Mã | Tên | x | y | Kích thước | Ghi chú |\n|---|---|---:|---:|---|---|\n`;
    for(const [id,nm,x,y,w,h,desc] of v.skylights)
      s+=`| ${id} | ${nm} | ${n(x)} | ${n(y)} | ${n(w,1)} × ${n(h,1)} | ${md(desc)} |\n`;
  }

  s+=`\n## 6. Cổng\n\n| Trục | Vị trí | Từ | Đến | Rộng | Tên |\n|---|---:|---:|---:|---:|---|\n`;
  for(const [ax,pos,a,b,nm] of v.gates)
    s+=`| ${AX(ax)} | ${n(pos,1)} | ${n(a)} | ${n(b)} | ${n(b-a)} | ${nm} |\n`;

  s+=`\n## 7. Tường\n\n| Trục | Vị trí | Từ | Đến | Dày (mm) |\n|---|---:|---:|---:|---:|\n`;
  for(const [ax,pos,a,b,t] of v.walls)
    s+=`| ${AX(ax)} | ${n(pos,1)} | ${n(a,1)} | ${n(b,1)} | ${Math.round(t*1000)} |\n`;

  s+=`\n## 8. Nội thất\n\n| Loại | x | y | Rộng | Sâu |\n|---|---:|---:|---:|---:|\n`;
  for(const [k,x,y,w,h] of v.furn)
    s+=`| ${k} | ${n(x)} | ${n(y)} | ${n(w)} | ${n(h)} |\n`;

  s+=`\n---\n\n## 9. Điểm cần lưu ý\n\n${md(v.warn)}\n`;

  s+=`\n## 10. Kết quả bộ kiểm tra\n\n`;
  s+=errs.length ? `**${errs.length} lỗi:**\n\n`+errs.map(x=>`- ${x}`).join('\n')+'\n\n'
                 : `**Sạch — qua toàn bộ ${CHECKS.length} phép kiểm.**\n\n`;
  s+=CHECKS.map((c,i)=>`${i+1}. ${c}`).join('\n')+'\n';

  s+=`\n---\n\n## 11. Lịch sử phiên bản\n\n| Bản | Nội dung | DT kín |\n|---|---|---:|\n`;
  for(const x of VERSIONS)
    s+=`| ${x.id}${x===v?' ←':''} | ${x.label.replace(/^v\d+\s*—\s*/,'')} | ${n(x.areas.kin,1)} |\n`;
  s+=`\n### Thay đổi ở ${v.label}\n\n`+v.changes.map(c=>`- ${md(c)}`).join('\n')+'\n';
  return s;
}

/* Không có nút tải trên thanh công cụ — đặc tả được đồng bộ vào Phần I của mat-bang.md
   bằng cách gọi hàm này từ console (hoặc Playwright). Xem CLAUDE.md.
     specMarkdown(spec.current())      → đặc tả bản đang xem
     specMarkdown(spec.byId('v12'))    → đặc tả một bản bất kỳ                     */
window.specMarkdown = specMarkdown;
window.spec = {
  current: () => V,
  byId: id => VERSIONS.find(x => x.id === id),
  latest: () => VERSIONS[VERSIONS.length - 1],
};

function loadVersion(i){
  V = VERSIONS[i];
  ROOMS=V.rooms; WALLS=V.walls; DOORS=V.doors; WINDOWS=V.windows;
  SKYLIGHTS=V.skylights; FURN=V.furn; GATES=V.gates; STRIPS=V.strips; DIMS=V.dims;
  buildPlan(); buildTables();
  mode='fit'; fit();
}
sel.onchange = () => loadVersion(+sel.value);

/* ═══════════ PAN / ZOOM ═══════════ */
const view  = svg.parentNode;
const zVal  = document.getElementById('zVal');
const MINS = 0.04, MAXS = 6;
let S = {cx:BCX, cy:BCY, scale:1, rot:0};

const boxEff = () => S.rot
  ? {x:BCX-BOX.h/2, y:BCY-BOX.w/2, w:BOX.h, h:BOX.w}
  : BOX;
const rect  = () => view.getBoundingClientRect();
const clampS = s => Math.min(MAXS, Math.max(MINS, s));

function apply(){
  const r = rect();
  if(!r.width || !r.height) return;
  const w = r.width/S.scale, h = r.height/S.scale;
  svg.setAttribute('viewBox', `${S.cx-w/2} ${S.cy-h/2} ${w} ${h}`);
  zVal.textContent = Math.round(S.scale*100) + '%';
}
function fit(pad=0.995){
  const r = rect(), B = boxEff();
  S.scale = clampS(Math.min(r.width/B.w, r.height/B.h)*pad);
  S.cx = B.x + B.w/2; S.cy = B.y + B.h/2;
  apply();
}
function fitWidth(){
  const r = rect(), B = boxEff();
  S.scale = clampS(r.width/B.w*0.995);
  S.cx = B.x + B.w/2;
  S.cy = B.y + (r.height/S.scale)/2;
  apply();
}
function rotate(){
  S.rot = ROT = S.rot ? 0 : -90;
  scene.setAttribute('transform', S.rot ? `rotate(${S.rot} ${BCX} ${BCY})` : '');
  drawAnnot();
  mode='fit'; fit();
}
function bestOrientation(){
  const r = rect();
  const portrait  = Math.min(r.width/BOX.w, r.height/BOX.h);
  const landscape = Math.min(r.width/BOX.h, r.height/BOX.w);
  const want = landscape > portrait ? -90 : 0;
  if(S.rot !== want) rotate(); else fit();
}
function zoomAt(clientX, clientY, factor){
  const r = rect();
  const dx = clientX - r.left - r.width/2;
  const dy = clientY - r.top  - r.height/2;
  const px = S.cx + dx/S.scale, py = S.cy + dy/S.scale;
  const ns = clampS(S.scale*factor);
  if(ns === S.scale) return;
  S.scale = ns; S.cx = px - dx/ns; S.cy = py - dy/ns;
  apply();
}
const zoomCenter = f => { const r=rect(); zoomAt(r.left+r.width/2, r.top+r.height/2, f); };

let mode = 'fit';
const relayout = () => mode==='fit' ? fit() : mode==='wide' ? fitWidth() : apply();

svg.addEventListener('wheel', e => {
  e.preventDefault(); mode='free';
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0016)));
}, {passive:false});

let drag = null;
svg.addEventListener('pointerdown', e => {
  mode='free'; drag = {x:e.clientX, y:e.clientY};
  svg.setPointerCapture(e.pointerId); svg.classList.add('drag');
});
svg.addEventListener('pointermove', e => {
  if(!drag) return;
  S.cx -= (e.clientX - drag.x)/S.scale;
  S.cy -= (e.clientY - drag.y)/S.scale;
  drag = {x:e.clientX, y:e.clientY};
  apply();
});
const endDrag = () => { drag = null; svg.classList.remove('drag'); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

document.getElementById('zIn').onclick   = () => { mode='free'; zoomCenter(1.25); };
document.getElementById('zOut').onclick  = () => { mode='free'; zoomCenter(1/1.25); };
document.getElementById('zFit').onclick  = () => { mode='fit';  fit(); };
document.getElementById('zWide').onclick = () => { mode='wide'; fitWidth(); };
document.getElementById('z100').onclick  = () => { mode='free'; S.scale = 1; apply(); };
document.getElementById('zRot').onclick  = rotate;

const btnDim = document.getElementById('zDim');
btnDim.onclick = () => {
  LABELMODE = LABELMODE === 'tim' ? 'sd' : 'tim';
  btnDim.textContent = LABELMODE === 'tim' ? 'Nhãn: Tim tường' : 'Nhãn: Sử dụng';
  drawAnnot();
};

const side = document.querySelector('.side');
const btnSide = document.getElementById('zSide');
function setSide(show){
  show ? side.removeAttribute('hidden') : side.setAttribute('hidden','');
  btnSide.textContent = show ? 'Ẩn bảng' : 'Hiện bảng';
}
btnSide.onclick = () => setSide(side.hasAttribute('hidden'));

/* toàn màn hình */
const btnFull = document.getElementById('zFull');
const sheet   = document.querySelector('.sheet');
const btnExit = document.getElementById('zExit');

function toggleFull(){
  if(document.fullscreenElement) document.exitFullscreen();
  else sheet.requestFullscreen?.().catch(()=>{
    btnFull.textContent = '⛶ Không bật được';
    setTimeout(() => btnFull.textContent = '⛶ Toàn màn hình', 2000);
  });
}
btnFull.onclick = toggleFull;
btnExit.onclick = () => document.exitFullscreen();

let exitTimer;
function pokeExit(){
  btnExit.classList.add('show');
  clearTimeout(exitTimer);
  exitTimer = setTimeout(() => btnExit.classList.remove('show'), 2500);
}
btnExit.addEventListener('pointerenter', () => { clearTimeout(exitTimer); btnExit.classList.add('show'); });
btnExit.addEventListener('pointerleave', pokeExit);
sheet.addEventListener('pointermove', () => { if(document.fullscreenElement) pokeExit(); });

document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  btnExit.classList.remove('show');
  if(on) pokeExit();
  mode = 'fit';
  if(on) bestOrientation(); else fit();
});

addEventListener('keydown', e => {
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key === '+' || e.key === '=') { mode='free'; zoomCenter(1.25); e.preventDefault(); }
  else if(e.key === '-' || e.key === '_') { mode='free'; zoomCenter(1/1.25); e.preventDefault(); }
  else if(e.key === '0') { mode='fit'; fit(); e.preventDefault(); }
  else if(e.key === 'r' || e.key === 'R') { rotate(); e.preventDefault(); }
  else if(e.key === 'f' || e.key === 'F') { toggleFull(); e.preventDefault(); }
});

new ResizeObserver(relayout).observe(view);
loadVersion(VERSIONS.length-1);
</script>
